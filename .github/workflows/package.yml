name: Desktop packages
# Packaging breaks in ways the unit tests cannot see, almost always through dependencies, build
# scripts or the updater. Those changes build and start the real apps; anything else can be
# checked by hand with "Run workflow", and every release runs this before publishing.
on:
  push:
    branches: ['**']
    paths:
      - pyproject.toml
      - uv.lock
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - frontend/pnpm-workspace.yaml
      - frontend/vite.config.ts
      - scripts/**
      - src/expense_tracker/updates/**
      - .github/workflows/package.yml
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build-windows:
    # A branch push of the release commit is built again by the release workflow for its tag.
    if: "github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - run: uv sync --frozen
      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - run: uv run python scripts/release_manifest.py describe dist
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: release-windows
          path: |
            dist/Wydatki.exe
            dist/assets-windows.json

  build-linux:
    if: "github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore: release')"
    # The oldest supported runner keeps the binary's glibc requirement low enough for most distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - run: uv sync --group desktop --frozen
      - name: Build Linux package
        run: scripts/build_linux.sh
      - run: sudo apt-get update && sudo apt-get install -y rpm ruby-dev && sudo gem install --no-document fpm
      - name: Build .deb and .rpm
        run: scripts/package_linux.sh
      - run: uv run python scripts/release_manifest.py describe dist
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: release-linux
          path: |
            dist/Wydatki
            dist/assets-linux.json
            dist/*.deb
            dist/*.rpm

  build-macos:
    if: "github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - run: uv sync --group desktop --frozen
      - name: Build macOS app
        run: scripts/build_macos.sh
      - run: uv run python scripts/release_manifest.py describe dist
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: release-macos
          path: |
            dist/Wydatki-macOS.zip
            dist/assets-darwin.json

  install-check:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            install: dnf install -y ./wydatki-*.rpm
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./wydatki_*.deb
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-linux
      - run: ${{ matrix.install }}
      - run: wydatki --smoke-test
