name: Windows application
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Create ZIP archive for Release
        shell: pwsh
        run: Compress-Archive -Path dist/Wydatki.exe, dist/START.txt -DestinationPath Wydatki-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wydatki-Windows
          path: |
            dist/Wydatki.exe
            dist/START.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: Wydatki-Windows.zip
          generate_release_notes: true
