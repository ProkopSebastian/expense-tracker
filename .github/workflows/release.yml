name: Release desktop apps
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Published assets must stay immutable; re-running an old tag would overwrite them.
      - name: Refuse to rebuild a published release
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::$GITHUB_REF_NAME is already published. Release a new version instead."
            exit 1
          fi
      # The tag may be pushed together with its commit, so wait for that commit's CI instead of
      # requiring it to have finished already.
      - name: Wait for CI on the tagged commit
        run: |
          for _ in 1 2 3 4 5 6; do
            run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
            [ -n "$run_id" ] && break
            sleep 20
          done
          if [ -z "$run_id" ]; then
            echo "::error::No CI run for $GITHUB_SHA. Push the commit to a branch before tagging it."
            exit 1
          fi
          gh run watch "$run_id" --interval 30 --exit-status

  package:
    needs: verify
    uses: ./.github/workflows/package.yml

  publish:
    permissions:
      contents: write
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - run: uv sync --frozen
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Sign the complete update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: uv run python scripts/release_manifest.py sign release
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            release/Wydatki.exe
            release/Wydatki
            release/update-manifest.json
            release/update-manifest.sig
            release/*.deb
            release/*.rpm
            release/Wydatki-macOS.zip
      # The app updates from GitHub's "latest" release, so an older tag must never take it over.
      - name: Publish only after every signed asset has been uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ "$GITHUB_REF_NAME" = "$newest" ]; then latest=true; else latest=false; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$latest"
