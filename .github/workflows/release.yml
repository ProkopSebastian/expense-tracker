name: Release desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - run: uv sync --frozen
      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Create Windows archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Wydatki-Windows | Out-Null
          Copy-Item dist/Wydatki.exe package/Wydatki-Windows/
          Copy-Item dist/START.txt package/Wydatki-Windows/
          Copy-Item dist/CHANGES.txt package/Wydatki-Windows/
          Compress-Archive -Path package/Wydatki-Windows -DestinationPath Wydatki-Windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: Wydatki-Windows.zip

  build-linux:
    # The oldest supported runner keeps the binary's glibc requirement low enough for most distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - run: uv sync --group desktop --frozen
      - name: Build Linux package
        run: scripts/build_linux.sh
      - run: sudo apt-get update && sudo apt-get install -y rpm ruby-dev && sudo gem install --no-document fpm
      - name: Build .deb and .rpm
        run: scripts/package_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            dist/Wydatki-Linux-x86_64.tar.gz
            dist/*.deb
            dist/*.rpm

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - run: uv sync --group desktop --frozen
      - name: Build macOS app
        run: scripts/build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/Wydatki-macOS.zip

  publish:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Wydatki-Windows.zip
            release/Wydatki-Linux-x86_64.tar.gz
            release/*.deb
            release/*.rpm
            release/Wydatki-macOS.zip
