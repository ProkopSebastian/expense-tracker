<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123e35" />
    <title>Wydatki · Podsumowanie</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        // Kept in sync with the --app-canvas values in src/theme.css so the
        // loading screen never flashes a mismatched color before hydration.
        var CANVAS = {
          light: "#f6f7fc",
          dark: "#14151f",
          ocean: "#f2f8f9",
          forest: "#f6f8f2",
          rose: "#fbf6f8",
          sand: "#faf6ef",
          midnight: "#101b24",
          mocha: "#1c1917",
          lavender: "#f6f5fc",
          nord: "#2e3440",
          dracula: "#282a36",
          gruvbox: "#282828",
          "one-dark": "#282c34",
          "tokyo-night": "#1a1b26",
          catppuccin: "#24273a",
        };
        var DARK_THEMES = [
          "dark",
          "midnight",
          "mocha",
          "nord",
          "dracula",
          "gruvbox",
          "one-dark",
          "tokyo-night",
          "catppuccin",
        ];
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var theme = stored && stored !== "system" ? stored : null;
        if (theme) document.documentElement.setAttribute("data-theme", theme);
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = theme ? DARK_THEMES.indexOf(theme) !== -1 : systemDark;
        document.documentElement.style.backgroundColor =
          CANVAS[theme] || CANVAS[systemDark ? "dark" : "light"];
        if (dark) document.documentElement.setAttribute("data-scheme", "dark");
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }
      html[data-scheme="dark"] #boot-screen:not([data-failed="true"]) {
        color: #c9cbe0;
      }
      #boot-screen {
        max-width: 520px;
        margin: 80px auto;
        padding: 24px;
        color: #263c37;
        font:
          14px/1.6 "Segoe UI",
          sans-serif;
        text-align: center;
      }
      #boot-screen[data-failed="true"] {
        border: 1px solid #edcfca;
        border-radius: 12px;
        background: #fcf0ee;
        color: #8d3f3a;
      }
      #boot-screen button {
        margin-top: 14px;
        padding: 9px 16px;
        border: 1px solid #b7c8c1;
        border-radius: 8px;
        background: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="boot-screen" role="status">Uruchamianie aplikacji…</div>
    <script>
      (() => {
        const fail = (detail) => {
          if (document.documentElement.dataset.appReady === "true") return;
          const screen = document.getElementById("boot-screen");
          if (!screen) return;
          screen.dataset.failed = "true";
          screen.replaceChildren();
          const title = document.createElement("strong");
          title.textContent = "Nie udało się uruchomić interfejsu.";
          const message = document.createElement("div");
          message.textContent =
            detail || "Sprawdź plik app.log w folderze danych aplikacji.";
          const button = document.createElement("button");
          button.textContent = "Spróbuj ponownie";
          button.onclick = () => window.location.reload();
          screen.append(title, message, button);
        };
        window.addEventListener("error", (event) => fail(event.message));
        window.addEventListener("unhandledrejection", (event) =>
          fail(String(event.reason || "Nieznany błąd")),
        );
        window.setTimeout(
          () =>
            fail(
              "Interfejs nie uruchomił się w ciągu 10 sekund. Sprawdź plik app.log.",
            ),
          10000,
        );
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
